# Format:
# profile|match rules|candidate hosts|NoMachine .nxs template
#
# Match rules are separated by semicolons. A profile is selected when any rule
# matches the current WiFi connection, SSID, or IPv4 subnet.
#
# Candidate hosts are tried from left to right. Keep only the onboard computer
# addresses here if there are other NoMachine servers on the same WiFi.

iotswarm|connection=iotswarm_5G;ssid=iotswarm(5g);ssid=iotswarm_5G;subnet=192.168.230.0/24|onboard-nx.local 192.168.230.67 192.168.230.110 192.168.230.36 192.168.230.8 192.168.230.26|/home/jht/文档/NoMachine/nv.nxs
iotlab|connection=IoTLab_5G;connection=IoTLab(5g);ssid=IoTLab(5g);ssid=IoTLab_5G;subnet=192.168.220.0/24|onboard-nx.local 192.168.220.201 192.168.220.203|/home/jht/文档/NoMachine/Connection to 192.168.220.201.nxs
